# Google Cloud Build configuration for CityPee
# Automatically builds and deploys to Cloud Run when pushed to main branch

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/citypee:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/citypee:latest',
      '.'
    ]

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/citypee:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/citypee:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'citypee',
      '--image', 'gcr.io/$PROJECT_ID/citypee:$COMMIT_SHA',
      '--region', 'us-east1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '512Mi',
      '--cpu', '1',
      '--max-instances', '10',
      '--min-instances', '0',
      '--port', '3000',
      '--set-env-vars', 'NODE_ENV=production'
    ]

# Specify which images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/citypee:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/citypee:latest'

# Timeout (builds can take a while)
timeout: '1200s'